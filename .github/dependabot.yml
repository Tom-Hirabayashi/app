version: 2
updates:
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      # TypeScript 7 has no compiler API yet; Astro and typescript-eslint still require TS 6.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    groups:
      production-dependencies:
        applies-to: 'version-updates'
        patterns:
          - '*'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      ci-dependencies:
        applies-to: 'version-updates'
        patterns:
          - '*'
