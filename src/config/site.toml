title = "ひらとも"
name = "WEBへ"
body = [
  "20年以上にわたってniftyのホームページで紹介してきた、自作アプリですが、今回niftyのホームページサービスが改編、私の使ってきたサービスもなくなってしまいました。",
  "今後はこちらで、国語の授業や、校務に関係した自作ソフトを中心に、紹介させていただきたいと思っています。",
  "ちょっとしたプログラムばかりですが、何かのお役に立てたら、嬉しいです。",
]

