[config.site]
title = "ひらともWEB"
description = "国語や学校で役立つフリーソフト"
pageTitle = "ひらともWEB"
pageDescription = "国語や学校で役立つフリーソフト"
url = "https://tom-hirabayashi.github.io/app/"
repository = "https://github.com/Tom-Hirabayashi/app"
footerNote = "powered by Astro navfolio"

[config.theme]
# 可用色盘：
# green-soft, green-vivid, rose-soft, pink-soft, purple-soft, blue-soft, orange-soft, brown-soft
palette = "orange-soft"
# 原生 UI 语言。可用值：en、ja、zh-CN、zh-TW。未知值会回退到 en。
lang = "ja"

[config.fonts]
# 英文とコード用の UI フォント
# 例: Maple Mono, Georgia, serif など
en = "Maple Mono"
code = "Monaco"

# 日本語本文はシステムフォントを優先して使う設定。
# 例: "Hiragino Maru Gothic ProN, Yu Maru, Meiryo, sans-serif"
# ここでカンマ区切りのフォント候補を 1 つの文字列として書く。
zh = "Hiragino Maru Gothic ProN, Yu Maru, Meiryo, sans-serif"

# フォントファイルを使うやり方もある。
# 例: file = "/fonts/NotoSansJP-Regular.ttf"
# こうすると、ブラウザが埋め込みフォントを優先して使うことがある。
# 今はシステムフォント優先なので、ここは既存のファイルを残しておく。
file = "/fonts/ChillRoundM.ttf"

[config.code]
lightTheme = "catppuccin-latte"
darkTheme = "catppuccin-macchiato"
lineNumbers = true
wrap = true
preserveIndent = true
collapseStyle = "collapsible-auto"

[config.math]
render = "katex" # "katex" | "mathjax"

[config.comments]
enabled = false
provider = "none"
show_on_posts = true

[config.search]
enabled = true
shortcut = "mod+k"
placeholder = "Search notes..."
maxResults = 6

[config.pages.blog]
title = "Blog"
kicker = "Notebook archive"
subtitle = "日々のノート"
note = "気ままに、残したいことを綴ります。"
postsPerPage = 6
# date-fns 使用的日期格式模板。
dateFormat = "yyyy-MM-dd"
# 元信息分隔符。可以使用 "|"、"/" 等符号，也可以使用特殊值 "icon"。
metadataSeparator = "icon"
# 文章列表封面样式："card" 保留带边框的缩略图，"mask" 会将图片融合到右侧。
coverImageStyle = "mask"

[config.pages.blog.categories]
title = "Categories"
kicker = "Browse notes"
subtitle = ""
note = "A quiet index of recurring topics, gathered from article frontmatter."

[config.pages.blog.series]
title = "Series"
kicker = "Reading paths"
subtitle = ""
note = "Connected notes that can be followed in the order they were written."

[config.pages.projects]
title = "Projects"
kicker = "Project shelf"
subtitle = "授業や校務に役立つフリーソフト"
note = "学習支援・教材作成・校務効率化のために公開しているツールを、ジャンル別に整理して紹介しています。"

[config.pages.vibe]
title = "vibe"
kicker = ""
subtitle = "断片"
note = "ブログ未満のつぶやき"
showTrail = true

[config.pages.media]
title = "书影音"
subtitle = "读过、看过、听过的作品，以及一点当时的感受。"
note = "一页浏览书、电影、剧集、专辑与播客。"

[config.comments.giscus]
repo = ""
repo_id = ""
category = ""
category_id = ""
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "top"
light_theme = "light"
dark_theme = "dark"
lang = "zh-CN"
loading = "lazy"

[config.comments.utterances]
repo = ""
issue_term = "pathname"
label = "comment"
theme = "github-light"

[config.comments.waline]
server_url = ""
lang = "zh-CN"
dark = "html.dark"
pageview = true
comment = true

[config.profile]
name = "ひらとも"
handle = "@hiratomo-web"
role = "Japanese Language Instructional Designer"
email = "hello@example.com"
website = "https://tom-hirabayashi.github.io/app/"
github = "https://github.com/Tom-Hirabayashi"
avatar = "/files/title.gif"

